name: Build FILE AIM CREATOR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/fileaim/creator

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name='FILE-AIM-CREATOR'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.fileaim.creator'
            compileSdk 35

            defaultConfig {
              applicationId 'com.fileaim.creator'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#00E5FF</item>
              <item name="android:navigationBarColor">#020914</item>
              <item name="android:statusBarColor">#020914</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@style/AppTheme"
              android:label="FILE AIM CREATOR">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fileaim/creator/MainActivity.java <<'EOF'
          package com.fileaim.creator;

          import android.app.*;
          import android.os.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;

          public class MainActivity extends Activity {
            LinearLayout l;

            TextView t(String s,int z){
              TextView v=new TextView(this);
              v.setText(s);v.setTextColor(Color.WHITE);
              v.setTextSize(z);v.setPadding(20,15,20,15);
              return v;
            }

            public void onCreate(Bundle b){
              super.onCreate(b);
              key();
            }

            void key(){
              l=new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              l.setPadding(30,60,30,30);
              l.setBackgroundColor(Color.rgb(2,9,20));

              TextView logo=t("◎",70);
              logo.setGravity(17);
              logo.setTextColor(Color.CYAN);
              l.addView(logo);

              TextView title=t("FILE AIM CREATOR",25);
              title.setGravity(17);
              l.addView(title);

              TextView sub=t("Nhập key để kích hoạt",15);
              sub.setGravity(17);
              l.addView(sub);

              EditText key=new EditText(this);
              key.setHint("Nhập key của bạn");
              key.setTextColor(Color.WHITE);
              key.setHintTextColor(Color.GRAY);
              l.addView(key);

              Button go=new Button(this);
              go.setText("🔒 KÍCH HOẠT");
              l.addView(go);

              go.setOnClickListener(v->{
                if(key.getText().toString().trim().length()<6)
                  Toast.makeText(this,"Key không hợp lệ",
                    Toast.LENGTH_SHORT).show();
                else menu();
              });

              setContentView(l);
            }

            void menu(){
              l.removeAllViews();

              TextView h=t("FILE AIM CREATOR",25);
              h.setGravity(17);l.addView(h);

              String[] a={
                "📄  Tên file",
                "🔐  Mật khẩu",
                "💻  Chọn Script",
                "📦  Chọn Extension",
                "📁  Chọn file",
                "⚙  Yêu cầu"
              };

              for(String x:a) l.addView(t(x+"   ›",17));

              Button b=new Button(this);
              b.setText("⚡ CREATOR FILE");
              l.addView(b);

              b.setOnClickListener(v->
                Toast.makeText(this,"Đang tạo file...",
                  Toast.LENGTH_SHORT).show());
            }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FILE-AIM-CREATOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
